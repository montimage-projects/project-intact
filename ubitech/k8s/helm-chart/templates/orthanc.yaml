{{- if .Values.orthanc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orthanc
spec:
  replicas: {{ .Values.orthanc.replicaCount }}
  selector:
    matchLabels:
      app: orthanc
  template:
    metadata:
      labels:
        app: orthanc
    spec:
      {{- if .Values.nodeSelector.enabled }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeSelector.hostname }}
      {{- end }}
      containers:
      - name: orthanc
        image: "{{ .Values.orthanc.image.repository }}:{{ .Values.orthanc.image.tag }}"
        imagePullPolicy: {{ .Values.orthanc.image.pullPolicy }}
        ports:
        - containerPort: 4242
          name: dicom
        - containerPort: 8042
          name: http

---
apiVersion: v1
kind: Service
metadata:
  name: orthanc
spec:
  selector:
    app: orthanc
  type: {{ .Values.orthanc.service.type }}
  ports:
  - name: dicom
    port: 4242
    targetPort: 4242
  - name: http
    port: 8042
    targetPort: 8042
    {{- if eq .Values.orthanc.service.type "NodePort" }}
    nodePort: {{ .Values.orthanc.service.httpNodePort }}
    {{- end }}
{{- end }}
